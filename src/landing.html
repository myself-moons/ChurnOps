<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChurnOps | Overview</title>
  <meta name="description" content="ChurnOps — Customer Churn Prediction MLOps System. Pipeline overview, dataset stats, and experiment summary.">
  <style>
    :root {
      --ink:#1a1f36; --muted:#6b7280; --line:#e5e7eb; --paper:#f8fafc;
      --white:#fff; --indigo:#4f46e5; --amber:#f59e0b; --red:#dc2626;
      --green:#16a34a; --shadow:0 16px 40px rgba(26,31,54,.08);
    }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--paper); font:15px/1.6 system-ui,sans-serif; }
    .topbar { background:var(--ink); color:white; padding:22px clamp(20px,6vw,88px) 30px; border-bottom:4px solid var(--indigo); }
    nav { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:36px; font:700 12px sans-serif; }
    nav a { color:#9ca3af; text-decoration:none; padding:7px 12px; border:1px solid transparent; border-radius:6px; }
    nav a:hover, nav a.active { color:white; border-color:#4f46e5; background:#312e81; }
    .eyebrow { color:#818cf8; text-transform:uppercase; letter-spacing:.14em; font:700 11px sans-serif; margin-bottom:10px; }
    h1 { font-size:clamp(34px,6vw,68px); line-height:1; margin:0 0 16px; font-weight:800; }
    .lead { color:#93c5fd; max-width:720px; font-size:18px; margin:0; }
    main { max-width:1320px; margin:0 auto; padding:36px clamp(20px,6vw,88px) 64px; }
    .pipeline { display:grid; grid-template-columns:repeat(4,1fr); gap:0; margin-top:4px; }
    .stage { background:var(--white); padding:20px; border:1px solid var(--line); box-shadow:var(--shadow); min-height:110px; }
    .stage:first-child { border-radius:6px 0 0 6px; } .stage:last-child { border-radius:0 6px 6px 0; }
    .stage + .stage { border-left:0; }
    .stage small { color:var(--indigo); font:700 11px sans-serif; text-transform:uppercase; letter-spacing:.1em; }
    .stage strong { display:block; font-size:17px; margin-top:8px; }
    .stage span { color:var(--muted); display:block; margin-top:4px; font-size:13px; }
    .section-head { display:flex; justify-content:space-between; align-items:end; gap:16px; margin:44px 0 16px; }
    h2 { font-size:22px; margin:0; font-weight:700; }
    .section-note { color:var(--muted); margin:0; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(12,1fr); gap:18px; }
    .card { background:var(--white); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:8px; padding:22px; }
    .datasets { grid-column:span 7; } .results { grid-column:span 5; } .runs { grid-column:span 12; }
    .row { display:flex; justify-content:space-between; gap:15px; padding:12px 0; border-bottom:1px solid var(--line); }
    .row:last-child { border-bottom:0; }
    .label { font-weight:700; font-size:14px; }
    .detail { color:var(--muted); text-align:right; font-size:13px; }
    .metric { margin:14px 0; }
    .metric-top { display:flex; justify-content:space-between; font:700 13px sans-serif; margin-bottom:6px; }
    .bar { height:9px; background:#e0e7ff; border-radius:3px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--indigo); border-radius:3px; }
    .run-meta { display:flex; gap:28px; flex-wrap:wrap; margin-top:16px; }
    .run-meta strong { display:block; font-size:24px; font-weight:800; }
    .run-meta span { color:var(--muted); font-size:13px; }
    .pill { display:inline-block; background:#e0e7ff; color:var(--indigo); border-radius:12px; padding:3px 10px; font:700 11px sans-serif; }
    .pill.churn { background:#fee2e2; color:var(--red); }
    .pill.ok    { background:#dcfce7; color:var(--green); }
    footer { color:var(--muted); margin-top:28px; font-size:13px; }
    @media(max-width:800px) {
      .pipeline { grid-template-columns:repeat(2,1fr); }
      .stage:first-child, .stage:last-child { border-radius:0; }
      .stage + .stage { border-left:1px solid var(--line); }
      .datasets,.results { grid-column:span 12; }
    }
    @media(max-width:500px) {
      .pipeline { grid-template-columns:1fr; }
      .stage { border-radius:6px !important; border:1px solid var(--line) !important; margin-bottom:6px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <nav aria-label="Main navigation">
      <a class="active" href="/">Overview</a>
      <a href="/dashboard">MLflow Dashboard</a>
      <a href="/predict">Predict</a>
      <a href="/docs">API Docs</a>
    </nav>
    <div class="eyebrow">ChurnOps / Project Overview</div>
    <h1>Customer Churn<br>Prediction.</h1>
    <p class="lead">From raw customer data to a reproducible, tracked model. Three classifiers. ROC-AUC selection. FastAPI serving.</p>
  </header>
  <main id="app"><p>Loading project overview...</p></main>
  <script>
    const app = document.getElementById('app');
    const number  = v => new Intl.NumberFormat().format(v || 0);
    const percent = v => `${(Number(v || 0) * 100).toFixed(1)}%`;
    const dataset = (label, v) =>
      `<div class="row"><span class="label">${label}</span><span class="detail">${number(v.rows)} rows / ${number(v.features)} features<br>${v.missing_values ? number(v.missing_values)+' missing' : 'complete'}</span></div>`;
    const metric = (label, v) =>
      `<div class="metric"><div class="metric-top"><span>${label}</span><span>${percent(v)}</span></div><div class="bar"><span style="width:${Math.min(100,Number(v||0)*100)}%"></span></div></div>`;

    async function load() {
      try {
        const data = await fetch('/api/dashboard').then(r => r.json());
        const latest = data.tracking.latest_run;
        const best   = data.tracking.best_run;
        const stageDesc = ['Merge 5 Excel source files','Encode & scale features','Compare LR, RF, XGBoost','Score best model'];
        app.innerHTML = `
          <section class="section-head"><div><h2>Pipeline at a glance</h2><p class="section-note">Every stage is reproducible through DVC.</p></div></section>
          <section class="pipeline">${data.project.pipeline.map((s,i)=>`<div class="stage"><small>Stage ${i+1}</small><strong>${s}</strong><span>${stageDesc[i]}</span></div>`).join('')}</section>
          <section class="section-head"><div><h2>What the model sees</h2><p class="section-note">Raw and processed dataset health.</p></div></section>
          <section class="grid">
            <div class="card datasets">
              ${dataset('Training data', data.datasets.train)}
              ${dataset('Test data', data.datasets.test)}
              ${dataset('Processed train', data.datasets.processed_train)}
              ${dataset('Processed test', data.datasets.processed_test)}
            </div>
            <div class="card results">
              <h2>Best model results</h2>
              <p class="section-note">Metrics from the selected model.</p>
              ${metric('ROC-AUC',  data.results.roc_auc)}
              ${metric('F1 Score', data.results.f1_score)}
              ${metric('Precision',data.results.precision)}
              ${metric('Recall',   data.results.recall)}
              ${metric('Accuracy', data.results.accuracy)}
              <p style="margin-top:12px;font-size:13px;color:var(--muted)">Model: <strong>${data.results.model||data.tracking.selected_model}</strong></p>
            </div>
            <div class="card runs">
              <h2>Experiment progress</h2>
              <p class="section-note">MLflow tracks every model family and parameter set for comparison.</p>
              <div class="run-meta">
                <div><strong>${number(data.tracking.run_count)}</strong><span>tracked runs</span></div>
                <div><strong>${number(data.tracking.finished_count)}</strong><span>finished</span></div>
                <div><strong>${best ? percent(best.test_roc_auc) : '-'}</strong><span>best ROC-AUC</span></div>
                <div><strong>${best ? best.model_type : '-'}</strong><span>best model</span></div>
                <div><strong>${data.tracking.selected_model}</strong><span>serving now</span></div>
              </div>
            </div>
          </section>
          <footer>Go to <a href="/dashboard">MLflow Dashboard</a> for full run history, or <a href="/predict">Predict</a> to test a customer.</footer>`;
      } catch(e) { app.innerHTML = `<p>Unable to load overview: ${e.message}</p>`; }
    }
    load();
  </script>
</body>
</html>
